name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Aether Vault APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generate Release Keystore
      run: |
        keytool -genkey -v -keystore release.jks -alias aetherexpense -keyalg RSA -keysize 2048 -validity 10000 -storepass androidreleasekey -keypass androidreleasekey -dname "CN=AetherVault, OU=Fintech, O=Aether, L=NewYork, S=NY, C=US"

    - name: Generate Wrapper & Build Release APK
      run: |
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleRelease --stacktrace
        mkdir -p release-output
        cp app/build/outputs/apk/release/*.apk release-output/Aether-Expense-Vault-Release.apk

    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Aether-Expense-Vault-Release-APK
        path: release-output/Aether-Expense-Vault-Release.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: "Aether Vault v1.0.0 (Fintech & Recurring Subscriptions)"
        body: |
          ### 💎 Aether Vault - Minimalist Fintech & SaaS Cashflow Engine
          
          Engineered for international founders, freelancers, and businesses looking for modern, secure liquidity management.
          
          **Core Highlights:**
          - 📊 **Dynamic Category Intensity Engine**: Real-time custom Canvas bar visualization of cashflow burn rate.
          - 💳 **Recurring Subscriptions Management**: Track SaaS overhead and recurring billing cycles.
          - 🔒 **Encrypted At Rest**: Hardware Keystore backed AES-256 GCM offline architecture (zero external trackers).
          - 🎨 **Nordic Dark Fintech Aesthetic**: Clean Obsidian, Mint Green, and Electric Indigo design.
        draft: false
        prerelease: false
        files: |
          release-output/Aether-Expense-Vault-Release.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
